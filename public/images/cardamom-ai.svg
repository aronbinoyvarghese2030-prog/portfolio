<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cardamomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="cardamomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <filter id="cardamomGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="380" rx="24" fill="url(#cardamomBg)" stroke="#d1fae5" stroke-width="1.5" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 6" opacity="0.6">
    <line x1="60" y1="0" x2="60" y2="380" />
    <line x1="180" y1="0" x2="180" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="420" y1="0" x2="420" y2="380" />
    <line x1="540" y1="0" x2="540" y2="380" />
    <line x1="0" y1="95" x2="600" y2="95" />
    <line x1="0" y1="190" x2="600" y2="190" />
    <line x1="0" y1="285" x2="600" y2="285" />
  </g>

  <!-- Stylized Cardamom Plant / Leaf Stem -->
  <g transform="translate(180, 50)">
    <!-- Main stem -->
    <path d="M 120 260 Q 110 160 130 50" stroke="#059669" stroke-width="4" stroke-linecap="round" />
    
    <!-- Left Leaf with veins -->
    <path d="M 115 200 C 40 180 30 110 80 80 C 130 110 120 160 115 200 Z" fill="#10b981" fill-opacity="0.18" stroke="#059669" stroke-width="2.5" />
    <path d="M 115 200 Q 80 150 80 80" stroke="#059669" stroke-width="1.5" stroke-dasharray="2 3" />
    
    <!-- Right Leaf with AI Scan Focus -->
    <path d="M 125 150 C 200 130 220 60 165 30 C 120 60 125 110 125 150 Z" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="2.5" />
    <path d="M 125 150 Q 165 90 165 30" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="2 3" />

    <!-- Cardamom Capsule Pods -->
    <ellipse cx="95" cy="220" rx="14" ry="22" transform="rotate(-25 95 220)" fill="#34d399" fill-opacity="0.4" stroke="#059669" stroke-width="2" />
    <ellipse cx="145" cy="190" rx="13" ry="20" transform="rotate(20 145 190)" fill="#60a5fa" fill-opacity="0.35" stroke="#2563eb" stroke-width="2" />

    <!-- AI Bounding Box Scanner -->
    <rect x="25" y="65" width="120" height="150" rx="12" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4" />
    
    <!-- Corner Crosshairs -->
    <path d="M 20 80 L 20 65 L 35 65" stroke="#2563eb" stroke-width="3" fill="none" />
    <path d="M 130 65 L 145 65 L 145 80" stroke="#2563eb" stroke-width="3" fill="none" />
    <path d="M 20 200 L 20 215 L 35 215" stroke="#2563eb" stroke-width="3" fill="none" />
    <path d="M 130 215 L 145 215 L 145 200" stroke="#2563eb" stroke-width="3" fill="none" />

    <!-- Detection Pin & Badge -->
    <g transform="translate(45, 45)">
      <rect width="110" height="26" rx="13" fill="#2563eb" />
      <circle cx="13" cy="13" r="4" fill="#60a5fa" />
      <text x="26" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Scan: Healthy 98%</text>
    </g>
  </g>

  <!-- Yield Intelligence Graph Pill -->
  <g transform="translate(380, 230)">
    <rect width="180" height="100" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="18" y="28" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">YIELD INTELLIGENCE</text>
    <text x="18" y="52" fill="#0f172a" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Predictive Yield</text>
    
    <!-- Mini sparkline chart -->
    <path d="M 18 80 L 45 74 L 75 78 L 105 65 L 135 60 L 162 50" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="162" cy="50" r="4" fill="#2563eb" />
  </g>

  <!-- Tag Pill Top Left -->
  <g transform="translate(36, 36)">
    <rect width="145" height="32" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#10b981" />
    <text x="28" y="21" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AgriTech + AI Vision</text>
  </g>
</svg>

