<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <rect width="500" height="500" rx="36" fill="url(#bgGrad)" stroke="#dbeafe" stroke-width="2" />
  
  <!-- Subtle circular rings -->
  <circle cx="250" cy="230" r="140" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
  <circle cx="250" cy="230" r="180" stroke="#93c5fd" stroke-width="1" stroke-dasharray="6 8" opacity="0.4" />

  <!-- Avatar Circle with Monogram -->
  <circle cx="250" cy="220" r="85" fill="url(#avatarGrad)" filter="drop-shadow(0 12px 24px rgba(37,99,235,0.25))" />
  <text x="250" y="235" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" letter-spacing="2">ABV</text>

  <!-- Tag Pill -->
  <g transform="translate(130, 360)">
    <rect width="240" height="44" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(15,23,42,0.06))" />
    <circle cx="28" cy="22" r="6" fill="#10b981" />
    <text x="44" y="27" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13">Aron Binoy Varghese</text>
  </g>

  <!-- Subtitle -->
  <text x="250" y="435" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="12">B.Tech CSE • Amal Jyothi</text>
</svg>

