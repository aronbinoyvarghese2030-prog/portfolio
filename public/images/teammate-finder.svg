<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="teamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="teamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="380" rx="24" fill="url(#teamBg)" stroke="#bfdbfe" stroke-width="1.5" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 5" opacity="0.6">
    <line x1="100" y1="0" x2="100" y2="380" />
    <line x1="200" y1="0" x2="200" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="400" y1="0" x2="400" y2="380" />
    <line x1="500" y1="0" x2="500" y2="380" />
  </g>

  <!-- Connecting Relationship Lines -->
  <path d="M 180 180 Q 300 120 420 170" stroke="#93c5fd" stroke-width="2.5" stroke-dasharray="6 6" fill="none" />
  <path d="M 300 240 Q 300 160 300 120" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 180 180 Q 240 250 300 240" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 420 170 Q 360 250 300 240" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Central Hub: Project Match -->
  <g transform="translate(240, 75)">
    <rect width="120" height="70" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <circle cx="60" cy="24" r="12" fill="#dbeafe" />
    <text x="60" y="28" text-anchor="middle" fill="#2563eb" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Hackathon</text>
    <text x="60" y="55" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Match Rate: 96%</text>
  </g>

  <!-- Student Node 1 (Frontend/Design) -->
  <g transform="translate(110, 140)">
    <rect width="130" height="90" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="36" cy="36" r="18" fill="#dbeafe" />
    <text x="36" y="42" text-anchor="middle" fill="#1e40af" font-family="system-ui, sans-serif" font-size="14" font-weight="700">UI</text>
    <text x="64" y="32" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Dev & UI</text>
    <text x="64" y="48" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">HTML • CSS • React</text>
    <rect x="20" y="64" width="90" height="18" rx="9" fill="#f1f5f9" />
    <text x="65" y="76" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Seeking Backend</text>
  </g>

  <!-- Student Node 2 (Backend/AI) -->
  <g transform="translate(360, 130)">
    <rect width="140" height="90" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="36" cy="36" r="18" fill="#ecfdf5" />
    <text x="36" y="42" text-anchor="middle" fill="#047857" font-family="system-ui, sans-serif" font-size="14" font-weight="700">AI</text>
    <text x="64" y="32" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Backend & AI</text>
    <text x="64" y="48" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Python • C • ML</text>
    <rect x="20" y="64" width="100" height="18" rx="9" fill="#f0fdf4" />
    <text x="70" y="76" text-anchor="middle" fill="#15803d" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Open to Collaborate</text>
  </g>

  <!-- Match Badge at bottom -->
  <g transform="translate(210, 240)">
    <rect width="180" height="46" rx="23" fill="#2563eb" />
    <circle cx="28" cy="23" r="10" fill="#60a5fa" />
    <path d="M 24 23 L 27 26 L 33 19" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
    <text x="46" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Perfect Synergy Found</text>
  </g>

  <!-- Tag Pill Top Left -->
  <g transform="translate(36, 36)">
    <rect width="150" height="32" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#3b82f6" />
    <text x="28" y="21" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Student Matchmaking</text>
  </g>
</svg>

